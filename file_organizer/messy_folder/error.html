<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 48px 56px;
    text-align: center;
    max-width: 480px;
  }
  .badge {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #f8fafc;
  }
  p {
    color: #94a3b8;
    font-size: 15px;
    line-height: 1.6;
  }
  a {
    display: inline-block;
    margin-top: 24px;
    color: #38bdf8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">ERROR</span>
    <h1>Something went wrong</h1>
    <p>The page you're looking for couldn't be found or the server hit a problem processing your request.</p>
    <a href="/">&larr; Back to home</a>
  </div>
</body>
</html>
